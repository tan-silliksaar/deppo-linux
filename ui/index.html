    </header>
    <section class="card" id="add-sub">
        <h2>Add a subscription</h2>
        <p id="empty-hint" class="hint" hidden>No subscriptions yet. Deppo checks these credentials with the server before saving them.</p>
        <form id="add-sub-form">
            <label for="server">Server</label>
            <input id="server" name="server" autocomplete="off" spellcheck="false" placeholder="h1">
            <label for="credentials">Credentials</label>
            <input id="credentials" name="credentials" autocomplete="off" spellcheck="false" placeholder="12345678:password">
            <button type="submit">Add</button>
        </form>
        <p id="add-sub-error" class="error" role="alert"></p>
    </section>
    <section id="startup" class="card startup-off" hidden>
        <p>Deppo is not set to start at login. Automatic backups need the background service.</p>
        <button id="startup-enable" type="button">Start Deppo at login</button>
        <p id="startup-error" class="error" role="alert"></p>
    </section>
    <main id="subs"></main>
    <script src="/script.js"></script>
