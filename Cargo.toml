[package]
name = "deppo-linux"
version = "1.0.6"
edition = "2021"
rust-version = "1.75"
description = "Linux client for Deppo storage (www.deppo.eu)"
license = "Apache-2.0"
repository = "https://github.com/tan-silliksaar/deppo-linux"
readme = "README.md"
publish = false

[[bin]]
name = "deppo"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
ctrlc = "3"
fuser = "0.15"
# Pin below edition-2024 / wasip2 releases so Ubuntu 22.04's cargo 1.75 can vendor+build.
getrandom = "=0.2.15"
ignore = "=0.4.18"
globset = "=0.4.16"
# tempfile >= 3.15 pulls getrandom 0.3 → wasip2 → wit-bindgen (edition 2024).
tempfile = "=3.10.1"
libc = "0.2"
native-tls = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
